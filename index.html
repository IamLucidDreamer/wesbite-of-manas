<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manas Shukla | Portfolio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script>
      window.addEventListener("load", function () {
        const loader = document.getElementById("loader");
        loader.classList.add("fade-out");

        setTimeout(() => {
          loader.style.display = "none";
        }, 1000);
      });
    </script>
  </head>
  <body>
    <div class="loader-wrapper" id="loader">
      <div class="loader"></div>
      <p class="loader-text">Winds are whispering...</p>
    </div>
    <header>
      <div></div>
      <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#resume">Resume</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
    <section class="hero">
      <div class="hero-content">
        <div class="hero-text">
          <h1>Hi, I'm Manas Shukla 👋</h1>
          <p>
            Founding Engineer @ Ionic Wealth<br />
            ex-Unacademy | Full-Stack Product Builder
          </p>
          <div class="hero-buttons">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
            <a href="#">Resume</a>
          </div>
        </div>
        <div class="hero-image">
          <img
            src="assets/pictures/hero_image.png"
            alt="Manas Shukla Portrait"
          />
        </div>
      </div>
    </section>
  </body>
</html>
